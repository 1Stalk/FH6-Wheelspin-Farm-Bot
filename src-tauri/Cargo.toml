[package]
name = "free-bot"
version = "1.2.0"
description = "FH6 Free Bot"
authors = ["1Stalk"]
license = "MIT"
edition = "2021"

[workspace]
members = [
    "core-bot"
]

[lib]
name = "free_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GearMetrics"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vigem-client = "0.1.0"
image = "0.25"
core-bot = { path = "core-bot" }

[profile.release]
opt-level = "z"      # optimize for binary size (instead of speed)
lto = true           # Link-Time Optimization - removes dead code across crates
strip = true         # strip debug symbols from the final binary
codegen-units = 1    # single codegen unit - maximum LTO effect
panic = "abort"      # no stack unwinding - removes unwind tables

[profile.dev]
opt-level = 2        # speeds up execution of local code in dev mode by 10x+

[profile.dev.package."*"]
opt-level = 3        # compile image processing libraries with maximum speed in dev mode
